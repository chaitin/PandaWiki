<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Token 测试</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f6f8;
      color: #1f2329;
    }
    .page {
      max-width: 720px;
      margin: 0 auto;
    }
    .page-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }
    .form-row {
      margin-bottom: 16px;
    }
    .form-row:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 13px;
      color: #646a73;
      margin-bottom: 6px;
    }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dee0e3;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #3370ff;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      color: #fff;
      background: #3370ff;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: #2860df; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #bbb; cursor: not-allowed; transform: none; }
    .btn-outline {
      color: #3370ff;
      background: #fff;
      border: 1px solid #3370ff;
    }
    .btn-outline:hover { background: #f2f6ff; }
    .row-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .answer-box {
      margin-top: 16px;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 8px;
      min-height: 80px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .answer-empty {
      color: #8f959e;
    }
    .hidden { display: none; }
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      color: #fff;
      background: #1f2329;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 1000;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: #00b42a; }
    .toast.error { background: #f53f3f; }
    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.6);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-title">API Token 测试</div>

    <div class="card">
      <div class="card-header">
        <h2 class="card-title">基础配置</h2>
        <button class="btn" id="btnDetail" onclick="testDetail()">发送请求</button>
      </div>
      <div class="form-row">
        <label>后端地址</label>
        <input type="text" id="baseUrl" value="http://localhost:8080" />
      </div>
      <div class="form-row">
        <label>API Token</label>
        <input type="text" id="token" placeholder="pw_xxxxxxxx..." />
      </div>
      <div class="form-row">
        <label>知识库 ID</label>
        <input type="text" id="kbId" placeholder="请输入知识库 ID" />
      </div>
    </div>

    <div class="card">
      <h2 class="card-title" style="margin-bottom: 20px;">上传文件</h2>
      <div class="form-row">
        <label>选择文件</label>
        <input type="file" id="docFile" />
      </div>
      <div id="navArea" class="hidden">
        <div class="form-row">
          <label>选择目录</label>
          <select id="navSelect">
            <option value="">请选择目录</option>
          </select>
        </div>
        <div class="row-actions">
          <button class="btn" id="btnConfirmUpload" onclick="confirmUpload()">确认上传</button>
        </div>
      </div>
      <div class="row-actions" id="uploadActionArea">
        <button class="btn" id="btnUpload" onclick="prepareUpload()">上传</button>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title" style="margin-bottom: 20px;">AI 问答</h2>
      <div class="form-row">
        <label>问题</label>
        <input type="text" id="query" placeholder="请输入问题" />
      </div>
      <div class="row-actions">
        <button class="btn" id="btnSend" onclick="testRetrieval()">发送</button>
      </div>
      <div class="answer-box" id="answerBox">
        <span class="answer-empty">答案将显示在这里</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function getConfig() {
      return {
        baseUrl: document.getElementById('baseUrl').value.trim().replace(/\/$/, ''),
        token: document.getElementById('token').value.trim(),
        kbId: document.getElementById('kbId').value.trim()
      };
    }

    function checkBase() {
      const cfg = getConfig();
      if (!cfg.token) { showToast('请先填写 API Token', 'error'); return null; }
      if (!cfg.kbId) { showToast('请先填写知识库 ID', 'error'); return null; }
      return cfg;
    }

    function showToast(msg, type) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      setTimeout(() => el.className = 'toast', 2500);
    }

    function setLoading(id, loading) {
      const btn = document.getElementById(id);
      if (loading) {
        btn.disabled = true;
        btn.dataset.originalText = btn.textContent;
        btn.innerHTML = '<span class="loading"></span>' + btn.textContent;
      } else {
        btn.disabled = false;
        btn.textContent = btn.dataset.originalText || btn.textContent.replace(/\s*$/, '');
      }
    }

    let navsLoaded = false;

    async function loadNavs() {
      const cfg = checkBase();
      if (!cfg) return false;
      try {
        const res = await fetch(`${cfg.baseUrl}/api/v1/nav/list?kb_id=${encodeURIComponent(cfg.kbId)}`, {
          headers: { 'Authorization': `Bearer ${cfg.token}` }
        });
        if (!res.ok) throw new Error('加载目录失败');
        const list = await res.json();
        const select = document.getElementById('navSelect');
        select.innerHTML = '<option value="">请选择目录</option>';
        if (!list || list.length === 0) {
          showToast('该知识库暂无目录', 'error');
          navsLoaded = false;
          return false;
        }
        list.forEach(nav => {
          const opt = document.createElement('option');
          opt.value = nav.id;
          opt.textContent = nav.name;
          select.appendChild(opt);
        });
        navsLoaded = true;
        return true;
      } catch (err) {
        showToast(err.message, 'error');
        navsLoaded = false;
        return false;
      }
    }

    async function prepareUpload() {
      const cfg = checkBase();
      if (!cfg) return;
      const fileInput = document.getElementById('docFile');
      if (!fileInput.files || !fileInput.files[0]) {
        showToast('请先选择文件', 'error'); return;
      }

      setLoading('btnUpload', true);
      const ok = await loadNavs();
      setLoading('btnUpload', false);

      if (!ok) return;

      document.getElementById('uploadActionArea').classList.add('hidden');
      document.getElementById('navArea').classList.remove('hidden');
    }

    async function confirmUpload() {
      const cfg = checkBase();
      if (!cfg) return;
      const navId = document.getElementById('navSelect').value;
      const fileInput = document.getElementById('docFile');
      if (!fileInput.files || !fileInput.files[0]) {
        showToast('请选择文件', 'error'); return;
      }
      if (!navId) {
        showToast('请选择目录', 'error'); return;
      }

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('kb_id', cfg.kbId);
      formData.append('nav_id', navId);

      setLoading('btnConfirmUpload', true);
      try {
        const res = await fetch(`${cfg.baseUrl}/api/v1/rag/documents`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${cfg.token}` },
          body: formData
        });
        const text = await res.text();
        if (res.ok) {
          showToast(text, 'success');
          fileInput.value = '';
          document.getElementById('navArea').classList.add('hidden');
          document.getElementById('uploadActionArea').classList.remove('hidden');
        } else {
          showToast('上传失败：' + text, 'error');
        }
      } catch (err) {
        showToast('上传失败：' + err.message, 'error');
      }
      setLoading('btnConfirmUpload', false);
    }

    async function testDetail() {
      const cfg = checkBase();
      if (!cfg) return;
      setLoading('btnDetail', true);
      try {
        const res = await fetch(`${cfg.baseUrl}/api/v1/knowledge_base/detail?id=${encodeURIComponent(cfg.kbId)}`, {
          headers: { 'Authorization': `Bearer ${cfg.token}` }
        });
        if (res.ok) {
          showToast('请求成功', 'success');
        } else {
          showToast('请求失败：' + res.status, 'error');
        }
      } catch (err) {
        showToast('请求失败：' + err.message, 'error');
      }
      setLoading('btnDetail', false);
    }

    async function testRetrieval() {
      const cfg = checkBase();
      if (!cfg) return;
      const query = document.getElementById('query').value.trim();
      if (!query) { showToast('请输入问题', 'error'); return; }

      const answerBox = document.getElementById('answerBox');
      answerBox.innerHTML = '<span class="answer-empty">思考中...</span>';
      setLoading('btnSend', true);
      try {
        const res = await fetch(`${cfg.baseUrl}/api/v1/rag/retrieval`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${cfg.token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ kb_id: cfg.kbId, query })
        });
        const text = await res.text();
        if (res.ok) {
          answerBox.textContent = text;
        } else {
          answerBox.innerHTML = '<span class="answer-empty">回答失败</span>';
          showToast('回答失败：' + text, 'error');
        }
      } catch (err) {
        answerBox.innerHTML = '<span class="answer-empty">回答失败</span>';
        showToast('回答失败：' + err.message, 'error');
      }
      setLoading('btnSend', false);
    }
  </script>
</body>
</html>
