# Only PDF paths with a PDF response MIME type may be previewed inline.
# $uri excludes the query string; never use $request_uri for this decision.
map "$uri|$upstream_http_content_type" $static_file_disposition {
    default attachment;
    ~*^/static-file/.+\.pdf\|application/pdf$ inline;
}

# CSP sandbox blocks Chromium's built-in PDF viewer. An empty value omits
# this header only for PDFs that passed the path and response MIME checks.
map $static_file_disposition $static_file_csp {
    default "sandbox; default-src 'none'";
    inline "";
}

upstream backend {
    server panda-wiki-api:8000;
}

server {
    charset utf-8;
    listen 8080 ssl http2;

    ssl_certificate /etc/nginx/ssl/panda-wiki.crt;
    ssl_certificate_key /etc/nginx/ssl/panda-wiki.key;

    location /503 {
        return 503;
    }

    # Every endpoint that answers with text/event-stream. Buffering has to be
    # off on all of them or the response only reaches the client once it is
    # complete. Keep this list in step with the handlers that set that content
    # type: chat message, chat widget, chat completions, the wechat service
    # answer, and the two admin-side creation and summary streams.
    location  ~ ^/(share/v1/chat/message|share/v1/chat/widget|share/v1/chat/completions|share/v1/app/wechat/service/answer|api/v1/creation/text|api/v1/node/summary/stream)$ {
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        # Forward client information
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;

        proxy_pass http://backend;
    }

    location = /api/v1/file/upload {
        proxy_pass http://backend;

        client_max_body_size 1000m;

        # Forward client information
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }

    location ~ ^/api {
        proxy_pass http://backend;

        client_max_body_size 1000m;

        # Forward client information
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }

    location ~ ^/share {
        proxy_pass http://backend;

        # Forward client information
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }

    location ~ ^/static-file/ {
        proxy_pass http://panda-wiki-minio:9000;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;

        client_max_body_size 1000m;

        proxy_hide_header Content-Disposition;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Disposition $static_file_disposition always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $static_file_csp always;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;

        proxy_cache off;
        proxy_buffering off;
    }

    location / {
        root /opt/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ $uri.html /index.html;
        if ($request_filename ~* .*\.(htm|html)$) {
            add_header Cache-Control "no-cache";
        }
    }
}
