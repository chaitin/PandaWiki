{{- if .Values.app.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "panda-wiki.name" . }}-app
  labels:
    {{- include "panda-wiki.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "panda-wiki.selectorLabels" (dict "root" . "component" "app") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "panda-wiki.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- include "panda-wiki.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      containers:
        - name: app
          image: {{ include "panda-wiki.image" (dict "root" . "image" .Values.app.image) }}
          imagePullPolicy: {{ include "panda-wiki.imagePullPolicy" (dict "root" . "image" .Values.app.image) }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          env:
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            # Read server-side by the Next.js middleware and the SSR data
            # fetchers. It is not a NEXT_PUBLIC_ variable, so it is not inlined
            # into the browser bundle and must be present at runtime.
            - name: TARGET
              value: {{ printf "http://%s-api:%v" (include "panda-wiki.name" .) .Values.api.port | quote }}
            - name: PORT
              value: {{ .Values.app.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
          # A TCP probe only. An HTTP probe would run the SSR path, which calls
          # the api, and a slow dependency would then look like a dead pod.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
