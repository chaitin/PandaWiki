{{- if .Values.qdrant.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "panda-wiki.name" . }}-qdrant
  labels:
    {{- include "panda-wiki.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  type: ClusterIP
  selector:
    {{- include "panda-wiki.selectorLabels" (dict "root" . "component" "qdrant") | nindent 4 }}
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "panda-wiki.name" . }}-qdrant
  labels:
    {{- include "panda-wiki.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  serviceName: {{ include "panda-wiki.name" . }}-qdrant
  replicas: 1
  selector:
    matchLabels:
      {{- include "panda-wiki.selectorLabels" (dict "root" . "component" "qdrant") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "panda-wiki.labels" . | nindent 8 }}
        app.kubernetes.io/component: qdrant
    spec:
      {{- include "panda-wiki.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      containers:
        - name: qdrant
          image: {{ include "panda-wiki.image" (dict "root" . "image" .Values.qdrant.image) }}
          imagePullPolicy: {{ include "panda-wiki.imagePullPolicy" (dict "root" . "image" .Values.qdrant.image) }}
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.qdrant.existingSecret }}{{ .Values.qdrant.existingSecret }}{{ else }}{{ include "panda-wiki.secretName" . }}{{ end }}
                  key: {{ if .Values.qdrant.existingSecret }}api-key{{ else }}qdrant-api-key{{ end }}
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
          # /healthz, /readyz and /livez all answer 200; verified on a real
          # cluster.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.qdrant.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
      {{- if not .Values.qdrant.persistence.enabled }}
      volumes:
        - name: storage
          emptyDir: {}
      {{- end }}
  {{- if .Values.qdrant.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        {{- include "panda-wiki.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.qdrant.persistence.size }}
  {{- end }}
{{- end }}
