{{- $s3 := splitList ":" (include "panda-wiki.s3Endpoint" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "panda-wiki.name" . }}-nginx
  labels:
    {{- include "panda-wiki.labels" . | nindent 4 }}
data:
  # Replaces the server.conf baked into the image so the upstreams follow the
  # chart's service addresses, and so every streaming endpoint is unbuffered.
  server.conf: |
    upstream backend {
        server {{ include "panda-wiki.name" . }}-api:{{ .Values.api.port }};
    }

    server {
        charset utf-8;
        listen {{ .Values.admin.port }} ssl http2;

        ssl_certificate /etc/nginx/ssl/panda-wiki.crt;
        ssl_certificate_key /etc/nginx/ssl/panda-wiki.key;

        location /503 {
            return 503;
        }

        # Every endpoint that answers with text/event-stream, and only those.
        # Keep this in step with web/admin/server.conf.
        location ~ ^/(share/v1/chat/message|share/v1/chat/widget|share/v1/chat/completions|share/v1/app/wechat/service/answer|api/v1/creation/text|api/v1/node/summary/stream)$ {
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;

            proxy_read_timeout 24h;
            proxy_send_timeout 24h;

            # Forward client information
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;

            proxy_pass http://backend;
        }

        location = /api/v1/file/upload {
            proxy_pass http://backend;

            client_max_body_size 1000m;

            # Forward client information
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
        }

        location ~ ^/api {
            proxy_pass http://backend;

            client_max_body_size 1000m;

            # Forward client information
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
        }

        location ~ ^/share {
            proxy_pass http://backend;

            # Forward client information
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
        }

        location ~ ^/static-file/ {
            proxy_pass http://{{ index $s3 0 }}:{{ index $s3 1 }};

            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
            send_timeout 300;

            client_max_body_size 1000m;

            if ($request_uri !~* \.pdf$) {
                add_header Content-Disposition "attachment" always;
            }

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;

            proxy_cache off;
            proxy_buffering off;
        }

        location / {
            root /opt/frontend/dist;
            index index.html index.htm;
            try_files $uri $uri/ $uri.html /index.html;
            if ($request_filename ~* .*\.(htm|html)$) {
                add_header Cache-Control "no-cache";
            }
        }
    }
