{{- if .Values.secrets.existingSecret }}
{{/*
The user manages this Secret. Validate it when the cluster is reachable, because
one failure mode is silent: a key that exists but is empty satisfies the kubelet,
and the backend then skips creating the admin user entirely (it only does so when
ADMIN_PASSWORD is non-empty), leaving a console nobody can log into and a pod that
looks perfectly healthy. Offline rendering cannot see the Secret, so this check
only runs on a real install or upgrade.
*/}}
{{- $secret := lookup "v1" "Secret" .Release.Namespace .Values.secrets.existingSecret }}
{{- if $secret }}
{{- $name := .Values.secrets.existingSecret }}
{{- $data := $secret.data | default dict }}
{{- $required := list "jwt-secret" "admin-password" }}
{{- if eq (include "panda-wiki.postgresSecretName" .) $name }}{{ $required = append $required "postgres-password" }}{{ end }}
{{- if eq (include "panda-wiki.redisSecretName" .) $name }}{{ $required = append $required "redis-password" }}{{ end }}
{{- if eq (include "panda-wiki.natsSecretName" .) $name }}{{ $required = append $required "nats-password" }}{{ end }}
{{- if eq (include "panda-wiki.s3SecretName" .) $name }}{{ $required = append $required "s3-secret-key" }}{{ end }}
{{- if and (not .Values.qdrant.existingSecret) (or .Values.qdrant.enabled .Values.raglite.enabled) }}{{ $required = append $required "qdrant-api-key" }}{{ end }}
{{- $missing := list }}
{{- range $key := $required }}
{{- if not (hasKey $data $key) }}{{ $missing = append $missing $key }}{{ end }}
{{- end }}
{{- if $missing }}
{{- fail (printf "Secret %q is missing: %s" $name (join ", " $missing)) }}
{{- end }}
{{- if not (index $data "admin-password") }}
{{- fail (printf "Secret %q has an empty admin-password. The backend only creates the admin account when ADMIN_PASSWORD is non-empty, so an empty value would start a console with no way in and no error to explain it. Set a password there, or delete the key and let the kubelet report it instead." $name) }}
{{- end }}
{{- end }}
{{- else }}
{{- if not (lookup "v1" "Namespace" "" "default") }}
{{- $missing := list }}
{{- range $key := (list "postgresPassword" "redisPassword" "natsPassword" "s3SecretKey" "qdrantApiKey" "jwtSecret" "adminPassword") }}
{{- if not (index $.Values.secrets $key) }}
{{- $missing = append $missing $key }}
{{- end }}
{{- end }}
{{- if $missing }}
{{- fail (printf `refusing to generate secrets while rendering without a cluster connection.

Rendering offline (helm template, Argo CD, Flux, helm lint without values) cannot
look up the values an earlier install already stored, so every render would invent
new ones. Applying that rotates the admin password and the JWT secret, signing
everyone out, and with the bundled middleware it also rotates the database
password away from the one PostgreSQL was initialised with.

Either set secrets.existingSecret to a Secret you manage, or set these values
explicitly: %s` (join ", " $missing)) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "panda-wiki.secretName" . }}
  labels:
    {{- include "panda-wiki.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ include "panda-wiki.secretValue" (dict "root" . "key" "postgres-password" "value" .Values.secrets.postgresPassword) | b64enc | quote }}
  redis-password: {{ include "panda-wiki.secretValue" (dict "root" . "key" "redis-password" "value" .Values.secrets.redisPassword) | b64enc | quote }}
  nats-password: {{ include "panda-wiki.secretValue" (dict "root" . "key" "nats-password" "value" .Values.secrets.natsPassword) | b64enc | quote }}
  s3-secret-key: {{ include "panda-wiki.secretValue" (dict "root" . "key" "s3-secret-key" "value" .Values.secrets.s3SecretKey) | b64enc | quote }}
  qdrant-api-key: {{ include "panda-wiki.secretValue" (dict "root" . "key" "qdrant-api-key" "value" .Values.secrets.qdrantApiKey) | b64enc | quote }}
  jwt-secret: {{ include "panda-wiki.secretValue" (dict "root" . "key" "jwt-secret" "value" .Values.secrets.jwtSecret) | b64enc | quote }}
  admin-password: {{ include "panda-wiki.secretValue" (dict "root" . "key" "admin-password" "value" .Values.secrets.adminPassword) | b64enc | quote }}
{{- end }}
